<title>MONSTER HUNTER PORTAL — 狩猟歴史館 PREVIEW</title>
<style>
:root{--gold:#e7c47e;--panel:#090705f2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050403;color:#eee;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}
body{display:grid;place-items:center;overflow:auto}
.frame{position:relative;width:min(100vw,calc(100vh * 1672 / 941));aspect-ratio:1672/941;overflow:hidden;background:#090706}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;user-select:none;pointer-events:none}
.hot{position:absolute;z-index:4;border:0;background:transparent;padding:0;cursor:pointer;outline:none}
.hot::after{content:"";position:absolute;inset:5%;border:1px solid transparent;border-radius:4px;transition:.16s}
.hot:hover::after,.hot:focus-visible::after{border-color:#e7c47e88;background:#e7c47e0d;box-shadow:0 0 24px #d7a65545}
.hot .tag{opacity:0;position:absolute;left:50%;bottom:6%;transform:translate(-50%,5px);padding:5px 8px;background:#090705eb;border:1px solid #8e6c3e;color:#e5c785;font:600 clamp(6px,.55vw,10px)/1 "Yu Gothic",sans-serif;letter-spacing:.12em;white-space:nowrap;transition:.16s;pointer-events:none}
.hot:hover .tag,.hot:focus-visible .tag{opacity:1;transform:translate(-50%,0)}
.psp{left:24.51%;top:50%;width:32.02%;height:25.93%;border-radius:38%}.psp::after{border-radius:38%}
.nav-hot{top:81.3%;height:9.5%}.nav-current{left:2.8%;width:30.4%}.nav-archive{left:34.2%;width:30.5%}.nav-future{left:65.8%;width:30.7%}
.drawer{position:absolute;z-index:10;right:1.7%;bottom:8.4%;width:27%;padding:14px 16px;background:var(--panel);border:1px solid #8e6c3e;box-shadow:0 18px 50px #000c;opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s;backdrop-filter:blur(8px)}
.drawer.on{opacity:1;transform:none;pointer-events:auto}
.drawer small{font:9px "Yu Gothic",sans-serif;letter-spacing:.18em;color:#e5c785}
.drawer h2{font-size:clamp(18px,2vw,30px);font-weight:500;margin:4px 0 2px}
.drawer .year{font:9px "Yu Gothic",sans-serif;color:#a19580}
.drawer p{font-size:clamp(12px,1vw,16px);margin:10px 0 0;line-height:1.55}
.drawer em{display:block;margin-top:6px;font:9px "Yu Gothic",sans-serif;color:#b6aa94;font-style:normal}
.x{position:absolute;right:7px;top:4px;background:none;border:0;color:#d6c49f;font-size:18px;cursor:pointer}
.status{position:absolute;z-index:8;left:1.3%;bottom:1.15%;padding:6px 9px;background:#080705c8;border:1px solid #6f5733;color:#d9c49a;font:8px/1 "Yu Gothic",sans-serif;letter-spacing:.12em}
@media(max-width:700px){body{display:block}.frame{width:100vw;height:auto}.drawer{left:2%;right:2%;width:auto;bottom:2%}.status{font-size:6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
