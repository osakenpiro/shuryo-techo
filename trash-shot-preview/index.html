<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e8">
  <title>ごみシュート / FIRST THROW</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./src/app.mjs"></script>
</head>
<body>
  <main class="game-shell">
    <header class="masthead">
      <a class="wordmark" href="./" aria-label="ごみシュート ホーム"><span class="brand-mark" aria-hidden="true">↗</span> ごみシュート</a>
      <span class="edition">FIRST THROW <span>試作 v0.1</span></span>
    </header>

    <section class="intro" aria-labelledby="game-title">
      <div><p class="eyebrow">A LITTLE THROW, A LITTLE JOY.</p><h1 id="game-title">狙って、<em>ぽいっ。</em></h1><p class="intro-copy">缶ひとつ、箱ひとつ。あと少しがむずかしい。</p></div>
      <div class="tally" aria-label="このプレイの記録">
        <div><strong id="attempt-count">00</strong><span>投げた数</span></div><div><strong id="success-count">00</strong><span>入った数</span></div>
      </div>
    </section>

    <div class="play-layout">
      <section class="scene-card" aria-label="ごみシュートのプレイ画面">
        <div class="scene-meta"><span><i aria-hidden="true"></i> ONE CAN / ONE BIN</span><span id="setup-description">距離 6 m · 高さ 1.3 m</span></div>
        <canvas id="scene" tabindex="0" aria-label="缶を箱に投げる立体のプレイ画面。横のつまみで角度と強さを調整し、投げるボタンまたはスペースキーで投げられます。"></canvas>
        <div class="scene-bottom"><span><i class="aim-dot" aria-hidden="true"></i>点線は、ねらいの目安</span><span class="key-hint"><kbd>Space</kbd> で投げる</span></div>
      </section>

      <section class="control-card" aria-label="投げ方の調整">
        <div class="control-heading"><span class="section-number">01</span><h2>ねらいを合わせる</h2><span class="small-arrow" aria-hidden="true">↗</span></div>
        <div class="range-control"><div class="range-label"><label for="yaw">左右</label><output id="yaw-value" for="yaw">まっすぐ</output></div><input id="yaw" type="range" min="-20" max="20" step="0.5" value="0"><div class="range-ends"><span>左</span><span>右</span></div></div>
        <div class="range-control"><div class="range-label"><label for="elevation">角度</label><output id="elevation-value" for="elevation">48°</output></div><input id="elevation" type="range" min="15" max="75" step="1" value="48"><div class="range-ends"><span>低め</span><span>高め</span></div></div>
        <div class="range-control"><div class="range-label"><label for="power">強さ</label><output id="power-value" for="power">7.8</output></div><input id="power" type="range" min="4" max="13" step="0.05" value="7.8"><div class="range-ends"><span>ふわっと</span><span>ぐっと</span></div></div>

        <div class="setup-controls"><div><label for="distance">箱までの距離</label><select id="distance"><option value="4">4 m</option><option value="6" selected>6 m</option><option value="8">8 m</option></select></div><div><label for="height">箱の高さ</label><select id="height"><option value="0.8">0.8 m</option><option value="1.3" selected>1.3 m</option><option value="1.8">1.8 m</option></select></div></div>

        <div class="shot-status" id="status-panel" data-phase="ready"><span id="status-icon" class="status-icon" aria-hidden="true">↗</span><div><p id="status" role="status" aria-live="polite" aria-atomic="true">いいところに、投げてみよう。</p><p id="status-detail">つまみで調整したら、準備はおしまい。</p></div></div>
        <button id="throw-button" class="throw-button" type="button"><span id="throw-label">投げる</span><span aria-hidden="true">↗</span></button>
        <button id="reset-button" class="reset-button" type="button" disabled>構え直す <span aria-hidden="true">↺</span></button>
      </section>
    </div>
    <footer class="page-footer"><span>小さなひと投げを、何度でも。</span><span>ごみシュート / FIRST THROW</span></footer>
  </main>
</body>
</html>
