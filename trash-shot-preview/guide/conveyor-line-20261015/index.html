<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRASHOOT — コンベアライン</title><style>body{margin:0;background:#f7efd9;color:#285d57;font:16px/1.7 system-ui}main{max-width:1100px;margin:auto;padding:24px}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}article{background:#fffdf4;border:2px solid #6b9689;border-radius:16px;overflow:hidden;padding-bottom:18px}img{width:100%;display:block}h2,p{margin:14px 20px}a{color:#286d66}h1{font-size:24px}</style><main><h1>TRASHOOT — コンベアライン</h1><p><a href="../../chapters45-preview/?v=20261015-conveyor-line-1&stage=factory-conveyor">4-2を遊ぶ ↗</a></p><section><article><img src="pc-line-safe-ready.png" alt="4本のベルトを乗り継ぐ" loading="lazy"><h2>4本のベルトを乗り継ぐ</h2><p>右へ、奥へ、左へ、そして奥へ。約10mの搬送ラインを通って箱を目指す。</p></article><article><img src="pc-press-one-result.png" alt="途中のプレスに注意" loading="lazy"><h2>途中のプレスに注意</h2><p>プレスに挟まれると缶が潰れてストップ。動きを見て投げるタイミングを変えよう。</p></article><article><img src="pc-press-two-result.png" alt="2基目も通り抜けよう" loading="lazy"><h2>2基目も通り抜けよう</h2><p>1基目を通過できても、帰りのベルトにはもう1基。運ばれる時間も考えて投げよう。</p></article></section></main></html>
