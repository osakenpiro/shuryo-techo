<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRASHOOT — 時限リレー</title><style>body{margin:0;background:#f7efd9;color:#285d57;font:16px/1.7 system-ui}main{max-width:1100px;margin:auto;padding:24px}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}article{background:#fffdf4;border:2px solid #6b9689;border-radius:16px;overflow:hidden;padding-bottom:18px}img{width:100%;display:block}h2,p{margin:14px 20px}a{color:#286d66}h1{font-size:24px}</style><main><h1>TRASHOOT — 仕掛けが動く間に</h1><p><a href="../../chapters45-preview/?v=20261015-timed-relay-1&stage=factory-relay">4-4を遊ぶ ↗</a></p><section><article><img src="pc-timely-ready.png" alt="一球目を左の受け口へ" loading="lazy"><h2>一球目を左の受け口へ</h2><p>まず仕掛けを動かす球を投げ込む。</p></article><article><img src="pc-timely-rolling-open.png" alt="球が流れている間に" loading="lazy"><h2>球が流れている間に</h2><p>琥珀色の目印を付けた球がレールを進む間だけ、扉が開く。</p></article><article><img src="pc-timely-result.png" alt="二球目を箱へ" loading="lazy"><h2>二球目を箱へ</h2><p>開いている間に二球目を投げ込もう。</p></article><article><img src="pc-held-expired-expired-while-held.png" alt="構えている間も進む" loading="lazy"><h2>構えている間も進む</h2><p>待ち過ぎると扉が閉じる。Rで一球目からやり直せる。</p></article></section></main></html>
