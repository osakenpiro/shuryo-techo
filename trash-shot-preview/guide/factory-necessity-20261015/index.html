<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRASHOOT — 工場の仕掛け</title><style>body{margin:0;background:#f7efd9;color:#285d57;font:16px/1.7 system-ui}main{max-width:1100px;margin:auto;padding:24px}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}article{background:#fffdf4;border:2px solid #6b9689;border-radius:16px;overflow:hidden;padding-bottom:18px}img{width:100%;display:block}h2,p,article>a:last-child{margin:14px 20px}a{color:#286d66}h1{font-size:24px}</style><main><h1>TRASHOOT — 工場の仕掛け</h1><p>4-2・4-3の新しい配置。スクリーンショットは実際の引っ張り操作で撮影しています。</p><section><article><a href="../../chapters45-preview/?v=20261015-factory-necessity-1&stage=factory-conveyor"><img src="pc-belt-ready.png" alt="4-2：ベルトに乗せて" loading="lazy"></a><h2>4-2：ベルトに乗せて</h2><p>手前で缶をベルトに乗せると、ガラス壁の低い通路を抜けて回収箱へ。</p><a href="../../chapters45-preview/?v=20261015-factory-necessity-1&stage=factory-conveyor">この面を遊ぶ ↗</a></article><article><a href="../../chapters45-preview/?v=20261015-factory-necessity-1&stage=factory-conveyor"><img src="pc-glass-return-result.png" alt="ガラスに当てる別の入り方" loading="lazy"></a><h2>ガラスに当てる別の入り方</h2><p>ガラスに当たっても、缶がベルトに落ちれば搬送される。高い弧での直通は防護壁と天井で防ぐ。</p><a href="../../chapters45-preview/?v=20261015-factory-necessity-1&stage=factory-conveyor">この面を遊ぶ ↗</a></article><article><a href="../../chapters45-preview/?v=20261015-factory-necessity-1&stage=factory-bank"><img src="pc-right-piston-held.png" alt="4-3：壁を使って" loading="lazy"></a><h2>4-3：壁を使って</h2><p>正面は遮蔽物。左右に往復する反射板で、返る方向とタイミングを考える。</p><a href="../../chapters45-preview/?v=20261015-factory-necessity-1&stage=factory-bank">この面を遊ぶ ↗</a></article><article><a href="../../chapters45-preview/?v=20261015-factory-necessity-1&stage=factory-bank"><img src="pc-left-piston-result.png" alt="左からでも、右からでも" loading="lazy"></a><h2>左からでも、右からでも</h2><p>同じ回収箱へ、反射板と中央の遮蔽物を使って入れる。</p><a href="../../chapters45-preview/?v=20261015-factory-necessity-1&stage=factory-bank">この面を遊ぶ ↗</a></article></section></main></html>
