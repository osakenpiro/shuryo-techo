<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRASHOOT · ゴール確認</title><style>body{margin:0;background:#fcf4e3;color:#286864;font:16px/1.7 system-ui}main{max-width:1000px;margin:auto;padding:24px}a{color:#286864}img{display:block;width:100%;height:auto;border:1px solid #a1bdaf;border-radius:10px}.phone{max-width:390px}figure{margin:24px 0}figcaption{padding:12px 0}</style><main><h1>TRASHOOT · ゴールはここ</h1><p>面に入ると約3秒、ゴールに輪と旗が出ます。下側の「ゴール確認」でいつでも見直せます。引っ張り始めると印は消えます。画面外やワイプの下に隠れる目標は方向矢印で示します。</p><p><a href="../../?v=20261014-goal-cues-1">第1・2章で遊ぶ</a> · <a href="../../chapter3-preview/?v=20261014-goal-cues-1&stage=outdoor-baseball">3-2で確認</a> · <a href="../../chapters45-preview/?v=20261014-goal-cues-1">第4・5章</a></p><figure><img src="room.png" alt="ゴミ箱の口にリングと旗が出る1-1"><figcaption>箱の口をハイライト。</figcaption></figure><figure><img src="baseball.png" alt="5人のキャッチできる観客を示す3-2"><figcaption>複数の通常ゴールもそれぞれ表示。3-2の別解は、バックスクリーンの得点板にある光る場所です。</figcaption></figure><figure><img class="phone" src="touch.png" alt="タッチ画面のゴール確認ボタンと旗"><figcaption>タッチでも同じボタンで確認。</figcaption></figure><p>画像は凍結版ゲームの原スクリーンショットです。</p></main></html>
