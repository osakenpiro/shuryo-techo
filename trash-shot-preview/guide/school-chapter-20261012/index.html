<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRASHOOT · 第2章 学校のスクリーンショット</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f1e3;color:#285f5b;font:17px/1.7 "Noto Sans CJK JP","Noto Sans JP",sans-serif}main{max-width:1480px;margin:auto;padding:42px 36px 70px}h1{font-size:36px;margin:0 0 15px;line-height:1.4}h2{font-size:28px;margin:0 0 8px}h3{font-size:22px}p{margin:6px 0 16px}a{color:#256d67}header{padding:20px 0 28px}.tag{font-size:14px;letter-spacing:.12em;color:#a8762e;font-weight:700}.lead{font-size:20px;max-width:1060px}.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:18px;border:1px solid #bdcdbb;border-radius:14px;background:#fffaf0;margin:22px 0}.flow b{padding:5px 12px;background:#e3ede2;border-radius:8px}.flow span{color:#c48236}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a{display:inline-block;padding:7px 14px;border-radius:8px;border:1px solid #aec7be;text-decoration:none}.board{padding:24px;border:1px solid #c3c8b0;border-radius:20px;background:#fffaf0;margin:30px 0;scroll-margin-top:20px}.board>p{color:#557d6f}.grid{display:grid;gap:18px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}figure{margin:0;min-width:0;border:1px solid #c3d0be;border-radius:14px;background:#f8f3e6;overflow:hidden}.zoom{display:block;background:transparent;border:0;padding:0;width:100%;cursor:zoom-in}.zoom img{display:block;width:100%;height:auto}figcaption{padding:15px 18px}figcaption strong{font-size:19px}figcaption p{font-size:16px;line-height:1.65;margin:6px 0 0}.note{padding:16px 20px;background:#e6eee2;border-radius:12px;margin-top:18px}.catalog{width:100%;border-collapse:collapse;margin:24px 0}.catalog th,.catalog td{padding:11px 15px;border-bottom:1px solid #d4d5bc;text-align:left}.catalog th{background:#e8efdf}.foot{font-size:14px;color:#638378}dialog{max-width:96vw;max-height:96vh;border:0;padding:12px;background:#fffbf0;border-radius:14px}dialog::backdrop{background:#163e37d9}dialog img{display:block;max-width:90vw;max-height:84vh;object-fit:contain}dialog button{padding:8px 16px;margin-bottom:10px}.title-phone{margin-top:20px;border:1px solid #c3d0be;border-radius:12px;padding:0 15px}.title-phone summary{min-height:48px;cursor:pointer;padding:10px 0;font-size:16px;font-weight:700}.mobile-title-preview{max-width:390px;margin:0 auto 16px}body.printboard main{max-width:1600px;padding:0}body.printboard header,body.printboard .standalone,body.printboard .board{display:none}body.printboard .board.selected{display:block;margin:0;border-radius:0;padding:24px;border:0}body.printboard figure .zoom{cursor:default}@media(max-width:760px){main{padding:22px 14px}h1{font-size:26px}h2{font-size:22px}.board{padding:16px}.two,.three{grid-template-columns:1fr}.lead{font-size:17px}.catalog td,.catalog th{padding:8px}}@media print{header .nav,dialog{display:none}main{padding:0}.board{break-inside:avoid}.zoom{border:0}.two,.three{grid-template-columns:repeat(2,minmax(0,1fr))}}.save-steps{padding-left:1.4em}.save-steps li{margin:7px 0}.candidate-notice{max-width:1060px}.catalog td,.catalog th{overflow-wrap:anywhere}@media(max-width:380px){.catalog{font-size:14px;table-layout:fixed}}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.zoom img{height:auto}@media(max-width:720px){main{padding:24px 16px}.grid{grid-template-columns:1fr}h1{font-size:28px}}#close-viewer{min-width:88px;min-height:44px}</style></head><body><main><header><p class="tag">TRASHOOT / CHAPTER 02</p><h1>放課後、教室から屋上へ</h1><p class="lead">第2章「学校」の4面。画像を押すと拡大できます。</p><p class="note">第2章まで遊べるフレンド向け公開版です。第1章クリア後、学校へ進めます。</p><nav class="nav"><a href="../../?v=20261012-school-window-1">部屋と学校を遊ぶ ↗</a><a href="../first-chapter-20261011/">第1章とお店のガイド</a></nav></header><section class="grid"><figure><button type="button" class="zoom" aria-label="2-1 教室の隅からの画像を拡大"><img width="1228" height="674" alt="2-1 教室の隅からの実際のゲーム画面" src="assets/school-classroom.png"></button><figcaption><strong>2-1 教室の隅から</strong><p>机列の向こう、右奥の箱へ。斜め方向と高い弧で、机・椅子を越えよう。</p></figcaption></figure><figure><button type="button" class="zoom" aria-label="2-2 自販機の小さな入口の画像を拡大"><img width="1228" height="674" alt="2-2 自販機の小さな入口の実際のゲーム画面" src="assets/school-vending.png"></button><figcaption><strong>2-2 自販機の小さな入口</strong><p>距離は短め、箱の口は狭め。引く力を抑え、正確に落とす面。</p></figcaption></figure><figure><button type="button" class="zoom" aria-label="2-3 向かいの教室への画像を拡大"><img width="1228" height="674" alt="2-3 向かいの教室への実際のゲーム画面" src="assets/school-passage.png?v=20261012-school-window-1"></button><figcaption><strong>2-3 向かいの教室へ</strong><p>こちらの教室の窓から、廊下を行き交う生徒の向こうへ。向かいの教室の窓を通して箱に入れよう。窓枠・壁に当たると跳ね返り、生徒との接触はミスになる。</p></figcaption></figure><figure><button type="button" class="zoom" aria-label="2-4 屋上から中庭への画像を拡大"><img width="1228" height="674" alt="2-4 屋上から中庭への実際のゲーム画面" src="assets/school-rooftop.png"></button><figcaption><strong>2-4 屋上から中庭へ</strong><p>屋上から地上の箱へ。高低差と弱い右風を読む。床・手すり・校舎に当たると跳ね返る。</p></figcaption></figure><figure><button type="button" class="zoom" aria-label="学校のステージ選択の画像を拡大"><img width="1232" height="1914" alt="学校のステージ選択の実際のゲーム画面" src="assets/school-menu.png?v=20261012-school-window-1"></button><figcaption><strong>学校のステージ選択</strong><p>部屋と学校を切り替え、購入品・コイン・記録を引き継ぐ。保存コードで学校の途中からも再開できる。</p></figcaption></figure></section><footer class="foot"><p>撮影：2026年10月11〜12日。2-3とステージ選択は窓越しの新版へ更新。画像は実際のゲーム画面です。第3章以降は製作中。</p></footer></main><dialog id="viewer"><button type="button" id="close-viewer">閉じる ×</button><img alt="拡大したスクリーンショット"></dialog><script>const d=document.querySelector('#viewer');document.querySelectorAll('.zoom').forEach(b=>b.addEventListener('click',()=>{d.querySelector('img').src=b.querySelector('img').src;d.querySelector('img').alt=b.querySelector('img').alt;d.showModal()}));document.querySelector('#close-viewer').onclick=()=>d.close();d.addEventListener('click',e=>{if(e.target===d)d.close()});</script></body></html>
