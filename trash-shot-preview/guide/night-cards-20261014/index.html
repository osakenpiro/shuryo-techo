<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRASHOOT — ステージのイメージと夜の川</title><style>body{margin:0;background:#fff8e9;color:#286864;font:16px/1.8 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:24px}h1{font-size:26px}a{color:inherit;text-underline-offset:4px}nav{display:flex;gap:20px;flex-wrap:wrap;margin:20px 0}figure{margin:24px 0}img{display:block;width:100%;height:auto;border:2px solid #9ebdb1;border-radius:16px}figcaption{margin-top:8px}small{color:#67877d}</style><main><h1>TRASHOOT — ステージのイメージと夜の川</h1><p>1-4から第5章まで、20面のカード画像を作りました。部屋の3枚と同じ、細かな道具や光を楽しめる絵に揃えています。</p><nav><a href="concepts.html">20面の画像を見る ↗</a><a href="../../?v=20261014-night-cards-1">第1・2章を遊ぶ ↗</a><a href="../../chapter3-preview/?v=20261014-night-cards-1&stage=outdoor-river">夜の川を遊ぶ ↗</a><a href="../../chapters45-preview/?v=20261014-night-cards-1">第4・5章プレビュー ↗</a></nav><figure><img src="river-dark-original.png" alt="船がいない間、暗い川と向こう岸がシルエットになるゲーム画面"><figcaption>3-4。船がいない間は、川と向こう岸が暗くなります。</figcaption></figure><figure><img src="river-passing-original.png" alt="手前を横切る大きな屋形船と蒸気船の灯りが、水面と向こう岸を照らすゲーム画面"><figcaption>船が手前を横切ると、灯りに照らされた部分が見えます。</figcaption></figure><figure><img src="mall-origin-original.png" alt="モールでアイスの位置から矢印と引っ張り表示が出ているゲーム画面"><figcaption>矢印と引っ張り表示の始点を、投げる物の位置に揃えました。小さい物の始点にも輪が見えます。</figcaption></figure><small>このページの3枚は実際のゲーム画面。画像一覧はステージカード用のコンセプト画像です。</small></main></html>
