<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRASHOOT — 東京タワーと隣の車窓</title><style>body{margin:0;background:#f6efdc;color:#285e5b;font:16px/1.7 system-ui,sans-serif}main{max-width:1160px;padding:24px;margin:auto}h1{font-size:28px}nav{display:flex;gap:12px;flex-wrap:wrap}a{color:#285e5b}nav a{padding:10px 18px;border:1px solid #92b5a6;border-radius:10px;background:#fffdf4}figure{margin:28px 0;padding:14px;border:1px solid #a9c3b4;border-radius:16px;background:#fffdf4}img{width:100%;height:auto;display:block;border-radius:8px}figcaption{padding:12px 6px 2px}p{max-width:840px}</style><main><h1>TRASHOOT — 東京タワーと隣の車窓</h1><p>第5章の開発試遊版。下の画像は実際のゲーム画面です。</p><nav><a href="../../chapters45-preview/?v=20261014-tower-train-2&stage=eccentric-tower">5-1 東京タワーから</a><a href="../../chapters45-preview/?v=20261014-tower-train-2&stage=eccentric-train">5-2 隣の車窓へ</a></nav><figure><img src="tower-whole.png" alt="赤白の東京タワーと周囲の街の全景"><figcaption>5-1：「タワー全景」で四脚・鉄骨・展望台を見渡せます。塔は333m、周囲の建物は15〜55mを基準にしています。</figcaption></figure><figure><img src="tower-launch.png" alt="250mの展望台から街を見下ろす投球画面"><figcaption>「投げる場所へ」で250mの展望台に戻ります。低い弧で、はるか下のごみ箱へ。ゴール側は右上のワイプで確認できます。</figcaption></figure><figure><img src="train-window.png" alt="電車の車内から隣を走る電車の窓を見た投球画面"><figcaption>5-2：自分の開いた窓から、並走する電車の窓を通して車内の箱へ。座席・窓枠・ドア・路線図を備えた車内になりました。</figcaption></figure><figure><img src="train-flight.png" alt="車窓越しに実際に投げた瞬間と同じ一投のゴール側ワイプ"><figcaption>線路・枕木・架線は循環してずっと続きます。隣の電車との速度差で窓がずれるため、タイミングと少し先を狙う角度が大切。窓枠・車体・座席に当たると跳ね返ります。</figcaption></figure><p>右ボタンドラッグや「見回す」で視点を動かせます。下側の「ズーム −／＋」「弧 −／＋」も使えます。</p></main>
