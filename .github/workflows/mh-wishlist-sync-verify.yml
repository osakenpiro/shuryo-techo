name: Wishlist sync verification
on:
  push:
    branches: [main, work/wishlist-shared-sync-v03]
    paths: ['equipment-wishlist/sync/**', '.github/workflows/mh-wishlist-sync-verify.yml']
  pull_request:
    paths: ['equipment-wishlist/sync/**', '.github/workflows/mh-wishlist-sync-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: equipment-wishlist/sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:core
      - run: npm run test:rules
        env:
          CI: 'true'
      - name: No production credentials or deployment
        run: echo 'Demo emulator tests only. No production Firebase project configured or changed.'
