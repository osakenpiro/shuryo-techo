name: Wishlist sync verification
on:
  push:
    branches: [main, work/wishlist-shared-sync-v03]
    paths: ['equipment-wishlist/sync/**', '.github/workflows/mh-wishlist-sync-verify.yml']
  pull_request:
    paths: ['equipment-wishlist/sync/**', '.github/workflows/mh-wishlist-sync-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: equipment-wishlist/sync
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:core
      - run: npm run test:rules
        env:
          CI: 'true'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Verification screenshots and lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mh-wishlist-shared-verification
          path: |
            equipment-wishlist/sync/test-results/
            equipment-wishlist/sync/package-lock.json
          retention-days: 7
      - name: No production credentials or deployment
        run: echo 'Demo emulator and isolated browser tests only. No production Firebase project configured or changed.'
