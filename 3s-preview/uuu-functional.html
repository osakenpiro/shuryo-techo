<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>UUU — Functional Archive</title>
<style>
:root{--bg:#05080c;--ink:#eef2f4;--muted:#87949d;--gold:#d7b16d;--glass:#a8dceb;--edge:rgba(215,230,236,.15)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
body{min-height:100dvh;background:
radial-gradient(circle at 70% 18%,rgba(211,173,100,.08),transparent 22%),
radial-gradient(circle at 24% 44%,rgba(110,183,220,.07),transparent 28%),
linear-gradient(180deg,#090d12,#040608 72%)}
.architecture{position:fixed;inset:0;pointer-events:none;opacity:.55;background:
linear-gradient(90deg,transparent 8%,rgba(255,255,255,.018) 8.2%,transparent 8.4%,transparent 91.6%,rgba(255,255,255,.018) 91.8%,transparent 92%),
repeating-linear-gradient(90deg,transparent 0 140px,rgba(231,195,125,.025) 141px,transparent 142px),
linear-gradient(180deg,transparent 70%,rgba(0,0,0,.55))}
.shell{position:relative;z-index:2;max-width:680px;margin:auto;padding:18px 18px 88px;min-height:100dvh}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}.logo{font:36px/1 Georgia,serif}.logo small{display:block;font:9px ui-monospace,Consolas,monospace;letter-spacing:.18em;color:#c7b890;margin-top:8px}.state{font:9px ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.14em}
.hero{padding:22px 0 12px}.kicker{font:10px ui-monospace,Consolas,monospace;letter-spacing:.2em;color:#d4bd8d}.hero h1{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-weight:400;font-size:34px;line-height:1.3;margin:8px 0}.hero p{color:#aab6bd;font-size:13px}
.hall{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0 26px}
.case{appearance:none;border:1px solid var(--edge);border-radius:70px 70px 14px 14px;background:linear-gradient(180deg,rgba(174,216,232,.06),rgba(7,11,15,.55));min-height:230px;color:var(--ink);padding:20px 12px 14px;cursor:pointer;box-shadow:inset 0 0 60px rgba(165,213,230,.03),0 18px 50px rgba(0,0,0,.28)}
.case.active{border-color:rgba(219,182,112,.48);box-shadow:0 0 40px rgba(220,181,108,.08),inset 0 0 55px rgba(220,181,108,.05)}
.crystal{width:50px;height:70px;margin:22px auto 26px;clip-path:polygon(50% 0,88% 28%,76% 80%,50% 100%,20% 76%,10% 30%);background:linear-gradient(145deg,#d7f9ff,#75a9ff 48%,#b06dff);filter:drop-shadow(0 0 22px rgba(154,226,247,.26))}
.case.active .crystal{background:linear-gradient(145deg,#f7f0d4,#d8b16a 48%,#8cb6ff);filter:drop-shadow(0 0 24px rgba(219,184,111,.34))}
.case .name{font-size:12px;line-height:1.45}.case .meta{font:8px ui-monospace,Consolas,monospace;color:#77858e;margin-top:8px;letter-spacing:.08em}
.panel{border:1px solid var(--edge);border-radius:18px;background:rgba(8,13,18,.72);backdrop-filter:blur(10px);padding:18px;margin-top:14px}
.panel h2{font-size:20px;margin:0 0 6px}.panel .sub{font-size:11px;color:var(--muted);margin-bottom:14px}
.fragment{border-top:1px solid rgba(255,255,255,.08);padding:12px 0}.fragment:first-of-type{border-top:0}.fragment label{display:block;font-size:10px;color:#9eabb3;margin-bottom:5px}.fragment input{width:100%;border:1px solid var(--edge);border-radius:12px;background:#0c131a;color:var(--ink);padding:10px 12px;font:14px inherit}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.badge{font:8px ui-monospace,Consolas,monospace;letter-spacing:.09em;border:1px solid var(--edge);border-radius:999px;padding:6px 8px;color:#9eabb4}.badge.gold{border-color:rgba(217,179,107,.4);color:#d7c08e}
.audience{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.aud{appearance:none;border:1px solid var(--edge);border-radius:12px;background:#0b1218;color:#aeb9c0;padding:11px 8px;font-size:11px;cursor:pointer}.aud.on{border-color:rgba(219,182,112,.55);color:#f0dfb7;background:rgba(219,182,112,.07)}
.actions{display:grid;gap:9px;margin-top:16px}.btn{appearance:none;border:1px solid var(--edge);border-radius:999px;background:#0b1218;color:var(--ink);padding:12px 18px;font-weight:700;cursor:pointer}.btn.primary{border-color:var(--gold);background:var(--gold);color:#211708}.btn:disabled{opacity:.4;cursor:not-allowed}
.history{margin-top:14px;border-top:1px solid rgba(255,255,255,.08);padding-top:12px}.hist{font-size:10px;color:#7e8b93;line-height:1.6}
.empty{padding:48px 10px;text-align:center;color:#9aa8b1}.empty .btn{margin-top:18px}
.footer{position:fixed;bottom:0;left:0;right:0;padding:12px 18px;background:linear-gradient(transparent,rgba(4,6,8,.96) 40%);font:9px ui-monospace,Consolas,monospace;color:#69767f;text-align:center;letter-spacing:.1em}
</style>
</head>
<body>
<div class="architecture"></div>
<main class="shell">
<header class="top"><div class="logo">UUU<small>UNDER YOUR UNIVERSE</small></div><div class="state">PRIVATE ARCHIVE</div></header>
<section class="hero"><p class="kicker">FUTURE MUSEUM</p><h1>収める。見つめる。<br>また、開く。</h1><p>あなたのStatus Objectが時間とともに残る場所。</p></section>

<div id="empty" class="empty" hidden>
まだ収蔵物がありません。<br><button class="btn primary" id="startScan">3SでScanする</button>
</div>

<div id="app" hidden>
<section class="hall" id="hall"></section>
<section class="panel" id="detail">
<h2 id="title"></h2><div class="sub" id="meta"></div>
<div id="fragments"></div>
<div class="badges"><span class="badge gold" id="stateBadge"></span><span class="badge">SELF</span><span class="badge">OWNER CONTROLLED</span></div>
<div class="audience">
<button class="aud" data-aud="PRIVATE">PRIVATE</button>
<button class="aud" data-aud="FRIEND">FRIEND</button>
<button class="aud" data-aud="PUBLIC">PUBLIC</button>
</div>
<div class="actions">
<button class="btn primary" id="project">STATUS OPENへ投影</button>
<button class="btn" id="newScan">新しいScan</button>
</div>
<div class="history"><p class="kicker">HISTORY</p><div id="history"></div></div>
</section>
</div>
</main>
<div class="footer">LOCAL ARCHIVE · NO EXTERNAL SEND</div>
<script type="module">
import {listObjects,getObject,activeObject,setActive,reviseFragment,setAudience,projectedSummary} from './functional-store.js';

const qs=new URLSearchParams(location.search);
let selectedId=qs.get('id')||activeObject()?.id||null;

function fmt(iso){try{return new Date(iso).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch{return iso;}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function render(){
 const objects=listObjects();
 document.getElementById('empty').hidden=objects.length>0;
 document.getElementById('app').hidden=objects.length===0;
 if(!objects.length)return;
 if(!objects.some(x=>x.id===selectedId))selectedId=objects[0].id;
 const hall=document.getElementById('hall');
 hall.innerHTML=objects.map(o=>'<button class="case '+(o.id===selectedId?'active':'')+'" data-id="'+esc(o.id)+'"><div class="crystal"></div><div class="name">'+esc(o.title)+'</div><div class="meta">'+esc(o.audience)+' · '+o.fragments.length+' FRAGMENTS</div></button>').join('');
 hall.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selectedId=b.dataset.id;setActive(selectedId);render();});
 const o=getObject(selectedId); if(!o)return;
 document.getElementById('title').textContent=o.title;
 document.getElementById('meta').textContent='収蔵 '+fmt(o.createdAt)+' · 更新 '+fmt(o.updatedAt);
 document.getElementById('stateBadge').textContent=o.state;
 document.getElementById('fragments').innerHTML=o.fragments.map(f=>'<div class="fragment"><label>'+esc(f.label)+' · '+esc(f.kind)+'</label><input data-frag="'+esc(f.id)+'" value="'+esc(f.value)+'"></div>').join('');
 document.querySelectorAll('[data-frag]').forEach(inp=>inp.onchange=()=>{reviseFragment(o.id,inp.dataset.frag,inp.value);render();});
 document.querySelectorAll('[data-aud]').forEach(b=>{b.classList.toggle('on',b.dataset.aud===o.audience);b.onclick=()=>{setAudience(o.id,b.dataset.aud);render();};});
 const p=projectedSummary(o);
 const project=document.getElementById('project');
 project.disabled=!p;
 project.textContent=o.audience==='PRIVATE'?'公開範囲を選ぶと投影できます':'STATUS OPENへ投影';
 project.onclick=()=>{if(projectedSummary(getObject(o.id)))location.href='./status-open-functional.html?project='+encodeURIComponent(o.id);};
 document.getElementById('history').innerHTML=(o.history.length?o.history.slice().reverse().map(h=>'<div class="hist">'+esc(fmt(h.at))+' · '+esc(h.type)+'</div>').join(''):'<div class="hist">まだ変更はありません。</div>');
}
document.getElementById('startScan').onclick=()=>location.href='./status-open-functional.html';
document.getElementById('newScan').onclick=()=>location.href='./status-open-functional.html';
render();
</script>
</body>
</html>
