.world:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 64% 38%,rgba(221,179,103,.09),transparent 24%),linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.6))}
.shell{position:relative;z-index:2;height:100dvh;max-width:1180px;margin:auto;padding:22px;display:flex;flex-direction:column}
.head{display:flex;justify-content:space-between;align-items:flex-start}.logo{font:36px/1 Georgia,serif}.logo small{display:block;font:9px ui-monospace,Consolas,monospace;letter-spacing:.18em;color:#c8b995;margin-top:9px}.state{font:9px ui-monospace,Consolas,monospace;letter-spacing:.15em;color:var(--muted)}
.stage{position:relative;flex:1;display:grid;place-items:center}
.scene{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .7s ease}.scene.active{opacity:1;pointer-events:auto}
.copy{z-index:3;text-align:center}.kicker{font:10px ui-monospace,Consolas,monospace;letter-spacing:.22em;color:#d7c59d}.title{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(38px,7vw,70px);font-weight:400;line-height:1.25;margin:10px 0}.sub{font-size:12px;color:#aeb9c1;letter-spacing:.08em}
.action{margin-top:26px;border:1px solid rgba(219,191,132,.42);background:rgba(7,11,15,.58);color:#f4efe5;border-radius:999px;padding:13px 25px;font:700 11px ui-monospace,Consolas,monospace;letter-spacing:.18em;cursor:pointer;backdrop-filter:blur(12px)}
.hall{position:absolute;inset:10% 3% 12%;display:flex;justify-content:center;align-items:end;gap:min(2vw,24px);perspective:1000px}
.case{width:min(18vw,165px);height:min(42vh,360px);border:1px solid rgba(190,220,232,.18);border-radius:80px 80px 12px 12px;background:linear-gradient(180deg,rgba(185,224,239,.08),rgba(10,14,18,.48));box-shadow:inset 0 0 60px rgba(156,215,236,.04),0 18px 55px rgba(0,0,0,.36);display:grid;place-items:center;position:relative;transform-origin:bottom;transition:.6s ease}
.case:nth-child(1),.case:nth-child(5){transform:scale(.78);opacity:.55}.case:nth-child(2),.case:nth-child(4){transform:scale(.9);opacity:.76}.case.active{border-color:rgba(225,191,124,.55);box-shadow:inset 0 0 70px rgba(218,179,105,.07),0 0 50px rgba(218,179,105,.1)}
.case:after{content:attr(data-age);position:absolute;bottom:14px;font:8px ui-monospace,Consolas,monospace;letter-spacing:.14em;color:#778690}
.fragment{width:52px;height:74px;clip-path:polygon(50% 0,88% 28%,76% 80%,50% 100%,20% 76%,10% 30%);background:linear-gradient(145deg,rgba(205,247,255,.95),rgba(92,143,241,.58) 45%,rgba(219,178,102,.38));filter:drop-shadow(0 0 24px rgba(149,220,241,.35));transition:.6s ease}
.case.active .fragment{transform:scale(1.25);filter:drop-shadow(0 0 34px rgba(226,190,116,.42))}
.timeline{position:absolute;bottom:8%;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,rgba(204,216,224,.14),transparent)}
.timeline:before{content:"PAST";position:absolute;left:0;top:8px;font:8px ui-monospace,Consolas,monospace;color:#6e7c85;letter-spacing:.15em}.timeline:after{content:"NOW";position:absolute;right:0;top:8px;font:8px ui-monospace,Consolas,monospace;color:#c5b58e;letter-spacing:.15em}
.focus{width:min(70vw,300px);height:min(52vh,420px);border:1px solid rgba(190,220,232,.2);border-radius:140px 140px 18px 18px;background:linear-gradient(180deg,rgba(174,216,231,.08),rgba(5,8,11,.52));display:grid;place-items:center;position:relative;box-shadow:inset 0 0 80px rgba(177,220,234,.05),0 22px 70px rgba(0,0,0,.45)}
.focus .fragment{transform:scale(1.65)}.meta{position:absolute;bottom:22px;left:22px;right:22px;border-top:1px solid rgba(255,255,255,.12);padding-top:11px;text-align:left;font:8px ui-monospace,Consolas,monospace;letter-spacing:.13em;color:#9caab3}
.door{width:min(58vw,260px);height:min(60vh,420px);border:1px solid rgba(231,192,118,.35);border-radius:130px 130px 12px 12px;background:radial-gradient(circle at 50% 45%,rgba(137,221,255,.11),transparent 35%),linear-gradient(180deg,rgba(224,185,108,.04),rgba(5,8,11,.55));display:grid;place-items:center;box-shadow:0 0 70px rgba(221,182,108,.08)}
.door .fragment{transform:scale(1.1) translateY(-20px)}.door:after{content:"STATUS OPEN";position:absolute;margin-top:210px;font:10px Georgia,serif;letter-spacing:.18em;color:#dfcda6}
.dots{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.dots i{width:5px;height:5px;border-radius:50%;background:#46525b}.dots i.on{background:var(--gold);box-shadow:0 0 12px var(--gold)}
.footer{display:flex;justify-content:space-between;font:9px ui-monospace,Consolas,monospace;color:#6d7a82;letter-spacing:.1em}
body.s1 .world{background-position:72% center;filter:brightness(.42) saturate(.55)}
body.s2 .world{background-position:84% center;filter:brightness(.38) saturate(.52);transform:scale(1.025)}
body.s3 .world{background-position:60% center;filter:brightness(.52) saturate(.66)}
@media(max-width:640px){.hall{gap:5px}.case{width:17vw;height:32vh}.case:nth-child(1),.case:nth-child(5){display:none}.focus{height:46vh}.door:after{margin-top:180px}.shell{padding:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.world{transform:none!important}}

<div class="world"></div>
