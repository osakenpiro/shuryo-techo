.world:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 35% 44%,rgba(142,235,255,.12),transparent 26%),linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.54))}
.noise{position:fixed;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(255,255,255,.025) 3px 4px)}
.shell{position:relative;z-index:2;width:min(100%,1120px);height:100dvh;margin:auto;padding:22px 22px 28px;display:flex;flex-direction:column}
.brand{display:flex;justify-content:space-between;align-items:flex-start}
.logo{font-family:Georgia,serif;font-size:34px;line-height:.9;letter-spacing:-.04em}
.logo small{display:block;font:9px ui-monospace,Consolas,monospace;letter-spacing:.22em;color:#d4dde3;margin-top:8px}
.sys{font:9px ui-monospace,Consolas,monospace;letter-spacing:.16em;color:var(--muted)}
.stage{flex:1;display:grid;place-items:center;text-align:center;position:relative}
.scene{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .7s ease,transform .7s ease}
.scene.active{opacity:1;pointer-events:auto;transform:none}
.copy{position:relative;z-index:4}
.kicker{font:10px ui-monospace,Consolas,monospace;letter-spacing:.22em;color:var(--cyan);margin-bottom:14px}
h1{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-weight:400;font-size:clamp(38px,8vw,68px);line-height:1.2;letter-spacing:.04em;margin:0;text-shadow:0 5px 28px rgba(0,0,0,.5)}
.sub{font-size:12px;color:#c6d2d9;letter-spacing:.08em;margin-top:15px}
.action{margin-top:28px;appearance:none;border:1px solid rgba(180,239,255,.55);background:rgba(5,13,20,.52);backdrop-filter:blur(12px);color:#f2fbff;border-radius:999px;min-width:160px;padding:14px 26px;font:700 12px ui-monospace,Consolas,monospace;letter-spacing:.18em;cursor:pointer;box-shadow:0 0 36px rgba(93,205,255,.08);transition:.25s}
.action:hover{background:rgba(160,236,255,.12);box-shadow:0 0 50px rgba(93,205,255,.18)}
.portal{position:absolute;width:min(62vw,430px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(175,240,255,.28);box-shadow:0 0 80px rgba(95,207,255,.15),inset 0 0 80px rgba(95,207,255,.07);animation:breathe 3.6s ease-in-out infinite}
.portal:before,.portal:after{content:"";position:absolute;border-radius:50%;inset:8%;border:1px dashed rgba(190,244,255,.26);animation:spin 22s linear infinite}
.portal:after{inset:22%;border-style:solid;animation-direction:reverse;animation-duration:16s}
.beam{position:absolute;width:2px;height:62vh;top:-10vh;background:linear-gradient(180deg,transparent,var(--cyan),rgba(110,205,255,.12),transparent);box-shadow:0 0 22px rgba(165,244,255,.65)}
.fragment{width:86px;height:112px;position:relative;filter:drop-shadow(0 0 28px rgba(126,224,255,.35));animation:float 3s ease-in-out infinite}
.fragment:before{content:"";position:absolute;inset:0;clip-path:polygon(50% 0,88% 28%,76% 80%,50% 100%,20% 76%,10% 30%);background:linear-gradient(145deg,rgba(188,247,255,.95),rgba(83,138,255,.58) 40%,rgba(118,70,220,.58));border:1px solid white}
.orbit{position:absolute;width:230px;height:230px;border:1px solid rgba(154,232,255,.18);border-radius:50%;animation:spin 11s linear infinite}
.orbit:before,.orbit:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 16px var(--cyan);top:18px;left:42px}
.orbit:after{top:auto;left:auto;right:20px;bottom:48px;background:var(--gold);box-shadow:0 0 16px var(--gold)}
.object{width:min(64vw,280px);aspect-ratio:.72;border-radius:18px;border:1px solid rgba(217,240,248,.4);background:linear-gradient(145deg,rgba(197,242,255,.16),rgba(4,12,19,.56) 48%,rgba(226,186,115,.13));backdrop-filter:blur(16px);box-shadow:0 25px 70px rgba(0,0,0,.45),0 0 50px rgba(135,220,255,.13);display:grid;place-items:center;position:relative;overflow:hidden}
.object:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 20%,rgba(255,255,255,.12) 45%,transparent 62%);transform:translateX(-120%);animation:sheen 4s ease-in-out infinite}
.object .fragment{transform:scale(.72)}
.plate{position:absolute;left:14px;right:14px;bottom:14px;text-align:left;border-top:1px solid rgba(255,255,255,.15);padding-top:10px;font:9px ui-monospace,Consolas,monospace;letter-spacing:.14em;color:#dbe7ec}
.openword{font-family:Georgia,"Yu Mincho",serif;font-size:clamp(54px,13vw,118px);font-weight:400;letter-spacing:.01em;text-shadow:0 0 44px rgba(130,227,255,.16)}
.arch{position:absolute;right:4%;bottom:6%;width:120px;height:170px;border:1px solid rgba(216,180,112,.26);border-radius:60px 60px 8px 8px;background:linear-gradient(180deg,rgba(224,185,108,.03),rgba(5,8,11,.5));box-shadow:inset 0 0 50px rgba(224,185,108,.05)}
.arch:after{content:"UUU";position:absolute;bottom:14px;left:0;right:0;font:9px Georgia,serif;letter-spacing:.25em;color:rgba(234,210,168,.58)}
.dots{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.dots i{width:5px;height:5px;border-radius:50%;background:#52606a;transition:.3s}.dots i.on{background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.footer{display:flex;justify-content:space-between;align-items:end;font:9px ui-monospace,Consolas,monospace;color:#778692;letter-spacing:.1em}
@keyframes breathe{50%{transform:scale(1.035);box-shadow:0 0 105px rgba(95,207,255,.22),inset 0 0 100px rgba(95,207,255,.10)}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-7px) rotate(1deg)}}@keyframes sheen{45%,100%{transform:translateX(140%)}}
body.s1 .world{filter:brightness(.62) saturate(.7);background-position:38% center}
body.s2 .world{filter:brightness(.48) saturate(.65);background-position:58% center}
body.s3 .world{filter:brightness(.76) saturate(.9);background-position:70% center;transform:scale(1)}
@media(max-width:600px){.shell{padding:18px}.arch{width:82px;height:118px;right:0;opacity:.75}.portal{width:78vw}.footer span:first-child{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.world{transform:none!important}}
</style>
